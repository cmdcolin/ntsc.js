name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Nothing was checking this, so twelve files had quietly drifted — most of
      # docs/ among them. `pnpm format` fixes whatever this reports.
      - run: pnpm format:check
      # A React Compiler bailout is invisible to every other step here: the build
      # succeeds, the tests pass, the page renders, and the component silently
      # loses its memoization. See scripts/compilercheck.mjs.
      - run: pnpm compiler
      # `pnpm build` typechecks the app; this adds the test files, which are
      # their own project because a third of them are node-side. Both halves used
      # to be decided by filename — see tsconfig.test.json.
      - run: pnpm typecheck
      # naga (the wgpu WGSL validator) statically checks every shader in
      # src/gpu/shaders.test.ts. Cache the compiled binary so it builds once.
      - name: Cache naga
        id: cache-naga
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/naga
          key: naga-cli-30.0.0
      - name: Install naga
        if: steps.cache-naga.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version 30.0.0 --locked
      - run: pnpm test
      # firestore.rules is the only thing standing between a stranger and a
      # user's saved profiles — the web config is public by design
      # (docs/adr/0005) — and the signed-in path cannot be exercised in a
      # headless run, so the rules are checked against the real rules engine in
      # the Firestore emulator instead. `pnpm test` above skips these when no
      # emulator is present; this is the arm that actually runs them.
      #
      # The emulator is a jar the CLI downloads on first use, cached here for the
      # same reason naga is. firebase-tools requires JDK 21+ to run it, which is
      # newer than what ubuntu-latest ships by default, so it's installed explicitly.
      #
      # Keyed on the lockfile rather than on the jar's own version: which emulator
      # build gets fetched is decided by the pinned firebase-tools, and a CLI bump
      # deletes the old jar and downloads another. A key naming the jar version
      # would then hold a file nothing uses, and quietly stop caching anything.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm test:rules

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # From v4 this leaves dotfiles out of the artifact. Nothing in dist/ is
      # hidden, so there is nothing to add back with `include-hidden-files`;
      # check that again if the build ever starts emitting one.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

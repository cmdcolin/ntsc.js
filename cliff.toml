# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# Grouping is done by plain regex on the raw commit message (commit_parsers
# below), not by turning on conventional_commits: that mode rewrites
# commit.message to strip anything matching "word: description", which
# silently eats incidental colons that aren't a real type — "Gallery: ...",
# "clips.mjs: ...", "CLAUDE.md: ..." — not just real feat:/fix: prefixes.
# Keeping it off means every displayed message stays exactly as written.
#
# Commits before 2026-08-01 predate any type-prefix convention, so the
# heuristic patterns below key off the leading verb instead — best-effort,
# not authoritative. Unmatched phrasing falls through to "Other Changes".
# New commits that actually use feat:/fix:/etc. prefixes are matched by the
# same patterns (they start with the type word too) and group correctly.

[changelog]
header = """
# Changelog

All notable changes to ntscythe are documented here.
"""
body = """

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/cmdcolin/ntscythe/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/cmdcolin/ntscythe/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
[`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/cmdcolin/ntscythe/commit/{{ commit.id }}) \
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}\
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = false
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
commit_parsers = [
  { message = "^Release v", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix ", group = "<!-- 1 -->Fixes" },
  { message = "^Add ", group = "<!-- 0 -->Features" },
  { message = "^Fix ", group = "<!-- 1 -->Fixes" },
  { message = "^Correct ", group = "<!-- 1 -->Fixes" },
  { message = "^Harden ", group = "<!-- 1 -->Fixes" },
  { message = "^Cap ", group = "<!-- 1 -->Fixes" },
  { message = "^Keep ", group = "<!-- 1 -->Fixes" },
  { message = "^Stop ", group = "<!-- 1 -->Fixes" },
  { message = "^Bound ", group = "<!-- 1 -->Fixes" },
  { message = "^Report ", group = "<!-- 1 -->Fixes" },
  { message = "^Patch ", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^Drop ", group = "<!-- 3 -->Refactor" },
  { message = "^Remove ", group = "<!-- 3 -->Refactor" },
  { message = "^Simplify ", group = "<!-- 3 -->Refactor" },
  { message = "^Extract ", group = "<!-- 3 -->Refactor" },
  { message = "^Split ", group = "<!-- 3 -->Refactor" },
  { message = "^Rename", group = "<!-- 3 -->Refactor" },
  { message = "^Dedupe ", group = "<!-- 3 -->Refactor" },
  { message = "^Replace ", group = "<!-- 3 -->Refactor" },
  { message = "^Reclaim ", group = "<!-- 3 -->Refactor" },
  { message = "^Collapse ", group = "<!-- 3 -->Refactor" },
  { message = "^Make ", group = "<!-- 3 -->Refactor" },
  { message = "^Default ", group = "<!-- 3 -->Refactor" },
  { message = "^Type ", group = "<!-- 3 -->Refactor" },
  { message = "^docs?[:( ]", group = "<!-- 4 -->Documentation" },
  { message = "^Document ", group = "<!-- 4 -->Documentation" },
  { message = "^README", group = "<!-- 4 -->Documentation" },
  { message = "^Update README", group = "<!-- 4 -->Documentation" },
  { message = "^Trim README", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Style" },
  { message = "^Format($| )", group = "<!-- 5 -->Style" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^Validate ", group = "<!-- 6 -->Tests" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = "^ci[:( ]", group = "<!-- 7 -->Chores" },
  { message = "^CI[:( ]", group = "<!-- 7 -->Chores" },
  { message = "^build", group = "<!-- 7 -->Chores" },
  { message = "^Bump ", group = "<!-- 7 -->Chores" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^Let ", group = "<!-- 0 -->Features" },
  { message = "^Surface ", group = "<!-- 0 -->Features" },
  { message = "^Wire ", group = "<!-- 0 -->Features" },
  { message = ".*", group = "<!-- 9 -->Other Changes" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
